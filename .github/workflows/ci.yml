name: SplitMate CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    env:
      DB_PASSWORD: Test12345
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: splitmate
          POSTGRES_USER: splitmate
          POSTGRES_PASSWORD: Test12345
        options: >-
          --health-cmd "pg_isready -U splitmate -d splitmate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and test backend
        working-directory: backend/backend
        run: ./mvnw clean verify

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        